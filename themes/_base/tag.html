<!--
    Polis Base Theme - Tag Page Template

    Shows all targets for a single tag. Generated at tags/<name>/index.html.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag: {{tag_name}} &mdash; {{site_title}}</title>
    <meta name="description" content="Content tagged &quot;{{tag_name}}&quot; on {{site_title}}">
    <link rel="stylesheet" href="{{base_css_path}}">
    <link rel="stylesheet" href="{{css_path}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="site-nav" style="padding: 1rem 1.5rem;">
        <a href="{{home_path}}" class="nav-home">&larr; Back to home</a>
    </nav>

    <!-- Tag Content -->
    <section class="recent-posts">
        <div class="container">
            <h2 class="section-title">Tag: {{tag_name}} ({{target_count}})</h2>
            <div class="post-list">
{{#targets}}
                <div class="post-item"><a href="{{uri}}">{{uri}}</a><span class="post-date">{{added}}</span></div>
{{/targets}}
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <a href="https://polis.pub" class="footer-logo">polis<span class="footer-tagline">the space we share</span></a>
    </footer>
</body>
</html>
