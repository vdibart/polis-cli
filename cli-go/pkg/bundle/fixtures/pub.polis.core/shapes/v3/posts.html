<!--
    Polis Base Theme - Archive Page Template

    Lists all posts. Generated at posts/index.html.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Posts &mdash; {{site_title}}</title>
    <meta name="description" content="All posts on {{site_title}}">
    <link rel="icon" type="image/svg+xml" href="{{favicon_path}}">
    <link rel="stylesheet" href="{{base_css_path}}">
    <link rel="stylesheet" href="{{css_path}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="content-col">
        <!-- Navigation -->
        <nav class="site-nav">
            <a href="{{home_path}}" class="nav-home">&larr; {{author_domain}}</a>
        </nav>

        <!-- Site Header -->
        <header class="site-header">
            <div class="site-identity">
                <div class="site-avatar">{{avatar_html}}</div>
                <div>
                    <div class="site-name">{{author_name}}</div>
                    <div class="site-handle">{{author_domain}}</div>
                </div>
            </div>
            <div class="site-stats">
                <span><strong>{{post_count}}</strong> posts</span>
                <span><strong>{{following_count}}</strong> following</span>
            </div>
        </header>

        <!-- All Posts -->
        <div class="post-list">
{{#posts}}
            {{> theme:post-item}}
{{/posts}}
        </div>

        <!-- Footer -->
        <footer class="site-footer">
            <a href="https://polis.pub" class="footer-logo">polis<span class="footer-tagline">Yours, truly.</span></a>
        </footer>
    </div>
</body>
</html>
