<!--
    Per-post entry partial.

    Rendered for sibling posts in the static stream artifact (via
    stream.html's siblings_above + siblings section loops — see those
    sites for the iteration grammar). Same DOM shape as the
    controller's JS-side renderer for dynamically-added entries
    (filter results, cross-origin entries from followed authors).

    SHAPE: renders the FULL post body inline in the unified expanded
    form — title link + body content. The static artifact is fully
    "baked" (no excerpt-then-fetch dance for entries already on the
    page), so the controller's lazy-fetch path skips entries with
    `is-expanded` and only fetches dynamically-added entries that
    arrive without bodies.

    Trade-off: per-post page payload is larger (4 sibling bodies inline)
    but the user sees complete content on first load — no scroll-driven
    fetches, no flicker, no wasted network when the body is short.
    Cross-origin lazy-fetch (controller's flow) is reserved for the
    owner stream view where entries come from many origins.

    Body styling: uniform prose treatment matching the focus entry.
    Sibling .entry-content shares a CSS rule with .focus-content
    .content-body (see stream.css), so every post in the stream renders
    with the same typography regardless of position. (Earlier iterations
    rendered siblings in a compact "excerpt-density" style; that
    differentiation was incidental and was dropped.)

    Template variables:
    - {{url}}             — absolute/relative path to /posts/.../slug.html
    - {{title}}
    - {{published_human}}
    - {{body_html}}       — full HTML-rendered body (markdown -> bluemonday-
                            sanitized HTML at publish time; trust chain is
                            the same as renderComment's body_html — see
                            stream.js TRUST CHAIN comment block)
    - {{comment_count}}
    - blessed_comments    — optional iteration over blessed comments on
                            this post (section block below populates the
                            inline .entry-comments-panel). The SSR
                            context omits it for siblings on per-post
                            pages today; the panel still renders empty
                            so the DOM stays uniform with the JS-rendered
                            stream-list path, where openCommentsPanel
                            animates an already-DOM-present panel rather
                            than fetching.
-->
<article class="entry entry--post entry--commentable is-loaded is-expanded {{is_above_focus}}"
         data-polis-entry-type="post">
    <!-- Meta line: just the date now (v4 site-identity). This is the public
         single-author page, so there is NO cross-author avatar here
         (renderPost adds the floated avatar for the owner's mixed-author
         stream). The timeline dot moved to the body rail below (anchors to the
         post's first line), and the comment indicator moved BELOW the post
         (left-aligned with the body) — both mirror the JS renderPost. -->
    <div class="entry-meta-line">
        <time class="entry-date-time" datetime="{{published}}">{{published_human}}</time>
    </div>
    <!-- Body rail: the timeline dot is just a position marker now (no longer a
         comment-add affordance — that moved to the comment badge below). The
         rail anchors the dot to the body's first line (.entry-rail in
         stream.css). Mirrors the JS bodyRail() output. -->
    <div class="entry-rail">
        <div class="timeline-dot" aria-hidden="true"></div>
        <div class="entry-body entry-body--expanded">
            <a class="entry-title-link {{title_link_state}}" href="{{url}}">
                <h3 class="entry-title">{{title}}</h3>
            </a>
            <div class="entry-content">
                {{body_html}}
            </div>
            <!-- Long-post collapse toggle (see stream.html focus comment). -->
            <button class="post-body-toggle" type="button" aria-expanded="false" hidden>show more</button>
        </div>
        <!-- Comment indicator BELOW the post body, left-aligned with the date /
             title / body (mirrors the JS renderPost; styled by
             .entry-rail > .entry-comments-badge). Always rendered, even at 0.
             Two stacked SVGs: the rest comment icon + the hover add-comment icon
             (.icon-add-comment, revealed on a commentable post). Paths match
             stream.js's buildCommentSVG / buildAddCommentSVG exactly. -->
        <a class="entry-comments-badge" href="{{url}}#comments">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>
            </svg>
            <svg class="icon-add-comment" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>
                <line x1="12" y1="7.5" x2="12" y2="12.5"/>
                <line x1="9.5" y1="10" x2="14.5" y2="10"/>
            </svg>
            <span class="count">{{comment_count}}</span>
        </a>
    </div>
    <!-- No SSR comments panel for siblings. Read-focus loads the single
         latest comment lazily via fetchFocusComment, which BUILDS the panel
         on demand — exactly the JS-rendered renderPost path (dynamic stream
         entries also ship no panel). An EMPTY <div class="entry-comments-
         panel"> here is actively harmful: enterFocusMode treats any present
         panel as "already loaded" and calls openCommentsPanel on it instead
         of fetchFocusComment, so the comment never loads and the reader sees
         an empty panel animate open (the read-focus "comment doesn't appear"
         bug). The SSR context never populates blessed_comments for siblings
         today, so the div was always empty — only the FOCUS entry (stream.html)
         carries its blessed comments inline. -->
</article>
