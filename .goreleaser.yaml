version: 2

project_name: polis

# The stamp is X.Y.Z+<private shortsha>: POLIS_SOURCE_SHA is the private commit the release was synced from,
# so a binary traces to its source. A snapshot build (the dry run) takes its version from POLIS_VERSION.
snapshot:
  version_template: "{{ .Env.POLIS_VERSION }}"

before:
  hooks:
    - go mod tidy -C cli-go
    - go mod tidy -C webapp
    # The remote instance's Vercel function and its manifest (EXPERIMENTAL), built without the Vercel CLI.
    # An instance and `polis branch deploy` fetch both by version; outside dist/, which --clean empties.
    - go run -C webapp ./cmd/vercel-function -version {{ .Version }} -out ../vercel-dist

builds:
  # CLI-only binary (~9 MB)
  - id: polis
    dir: cli-go
    main: ./cmd/polis
    binary: polis
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}+{{.Env.POLIS_SOURCE_SHA}}

  # Webapp-only binary (~11 MB)
  - id: polis-server
    dir: webapp
    main: ./cmd/server
    binary: polis-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}+{{.Env.POLIS_SOURCE_SHA}}

  # Bundled binary: CLI + serve command (~12 MB)
  - id: polis-full
    dir: webapp
    main: ./cmd/polis-full
    binary: polis-full
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}+{{.Env.POLIS_SOURCE_SHA}}

  # Tailor: site migration & health tool for self-hosters (~10 MB)
  - id: tailor
    dir: webapp
    main: ./cmd/tailor
    binary: tailor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}+{{.Env.POLIS_SOURCE_SHA}}

archives:
  # CLI-only archives
  - id: polis-archives
    ids:
      - polis
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - none*  # Binary only, no extra files

  # Webapp-only archives
  - id: polis-server-archives
    ids:
      - polis-server
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-server-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - none*

  # Bundled archives
  - id: polis-full-archives
    ids:
      - polis-full
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-full-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - none*

  # Tailor archives
  - id: tailor-archives
    ids:
      - tailor
    formats:
      - tar.gz
    name_template: "tailor-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - none*

# An SBOM (SPDX JSON, by syft) for every archive, published beside it as <archive>.sbom.json and listed in
# checksums.txt, so it is signed with everything else. syft is the release tooling's pinned build,
# put first on PATH by the release scripts (check_BUILD, publish.sh); this config names no version of its own.
sboms:
  - id: archives
    artifacts: archive

# ⭐ checksums.txt is what the release signs (checksums.txt.sig, made by publish.sh with the release key), so it
# lists every release asset AND the files polis-upgrade fetches from the tagged tree: the bash scripts it
# installs and the migration manifests that carry each migration script's checksum. Those are listed by their
# path in the tree, not attached to the release.
checksum:
  name_template: 'checksums.txt'
  algorithm: sha256
  extra_files:
    - glob: ./vercel-dist/*
    - glob: ./cli-bash/polis
      name_template: cli-bash/polis
    - glob: ./cli-bash/polis-tui
      name_template: cli-bash/polis-tui
    - glob: ./migrations/cli/manifest.json
      name_template: migrations/cli/manifest.json
    - glob: ./migrations/tui/manifest.json
      name_template: migrations/tui/manifest.json

release:
  github:
    owner: vdibart
    name: polis-cli
  extra_files:
    - glob: ./vercel-dist/*
  # ⛔ A DRAFT: publish.sh signs checksums.txt and attaches checksums.txt.sig, and only then publishes. Assets
  # are locked once a release is published (immutable releases), so the signature must go on the draft.
  draft: true
  prerelease: auto
  mode: replace
  header: |
    ## Polis {{ .Tag }}

    ### Four Distribution Targets

    | Binary | Description | Size |
    |--------|-------------|------|
    | `polis` | CLI-only (recommended) | ~9 MB |
    | `polis-server` | Web UI only | ~11 MB |
    | `polis-full` | CLI + `serve` command | ~12 MB |
    | `tailor` | Site migration & health tool for self-hosters | ~10 MB |

    ### Installation

    **Quick install (Linux/macOS):**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/vdibart/polis-cli/main/scripts/install.sh | bash
    ```

    **Manual download:** Choose your platform and binary type below.

changelog:
  disable: true  # We manage CHANGELOG.md manually
